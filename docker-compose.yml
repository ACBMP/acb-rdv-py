# The game servers' front door (online config, all games) and the ACB
# RendezVous server. AN-API (and MongoDB behind it) run on the host.
#
#   cp .env.example .env    # set the keys and the public address
#   mkdir -p data && cp /path/to/gamesettings_c1380_d873_s6285.cxb data/
#   docker compose up -d --build
#
# onlineconfig answers every game's onlineconfigservice.ubi.com request on
# port 80 and points each game at its own RendezVous server: ACB -> acb-rdv
# here, ACR -> its own server, ... (ONLINECONFIG_* in .env).

x-hardening: &hardening
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  read_only: true
  tmpfs: [/tmp]
  logging:
    driver: json-file
    options: {max-size: "20m", max-file: "5"}

services:
  onlineconfig:
    <<: *hardening
    build: .
    image: acb-rdv-py:latest
    container_name: onlineconfig
    command: ["onlineconfig"]
    environment:
      ONLINECONFIG_PORT: "8080"
      ONLINECONFIG_PUBLIC_ADDRESS: ${ONLINECONFIG_PUBLIC_ADDRESS:-${ACB_RDV_PUBLIC_ADDRESS:-127.0.0.1}}
      ONLINECONFIG_ACB_PORT: ${ACB_RDV_AUTH_PORT:-21030}
      ONLINECONFIG_ACB_ADDRESS: ${ONLINECONFIG_ACB_ADDRESS:-}
      ONLINECONFIG_ACR_PORT: ${ONLINECONFIG_ACR_PORT:-21040}
      ONLINECONFIG_ACR_ADDRESS: ${ONLINECONFIG_ACR_ADDRESS:-}
    ports:
      - "${ONLINECONFIG_PUBLISH_PORT:-80}:8080/tcp"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/OnlineConfigService.svc/GetOnlineConfig?onlineConfigID=ACB', timeout=2)"]
      interval: 30s
      timeout: 3s
      start_period: 5s

  # Host networking because the server
  #   - must see players' real source addresses (NAT traversal, RegisterEx),
  #   - talks to AN-API on 127.0.0.1 both ways (/rdv calls and /internal/notify),
  #   - may use a 200-port relay range (if ACB_RDV_NAT_RELAY=1; off by default)
  #     that is slow to publish through Docker's NAT.
  # Its ports are therefore opened directly on the host (ACB_RDV_*_PORT).
  acb-rdv:
    <<: *hardening
    build: .
    image: acb-rdv-py:latest
    container_name: acb-rdv
    command: ["acb_rdv"]
    network_mode: host
    env_file:
      - path: .env
        required: false
    environment:
      ACB_RDV_BACKEND: anapi
      # Until the CXB library exists: serve a prebuilt .cxb from ./data.
      ACB_RDV_GAME_SETTINGS: /data/gamesettings_c1380_d873_s6285.cxb
      # Once libcxb is available: serve the settings submodule's XMLs, encoded
      # in memory (edits on the host are picked up without a restart).
      # ACB_RDV_GAME_SETTINGS: /app/gamesettings
      # ACB_RDV_CXB_LIBRARY: /opt/cxb/libcxb.so
    volumes:
      - ./data:/data
      # - ./gamesettings:/app/gamesettings:ro
      # - /path/to/built/libcxb.so:/opt/cxb/libcxb.so:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request as u; u.urlopen('http://127.0.0.1:%s/' % os.environ.get('ACB_RDV_STATUS_PORT', '21032'), timeout=2)"]
      interval: 30s
      timeout: 3s
      start_period: 5s
